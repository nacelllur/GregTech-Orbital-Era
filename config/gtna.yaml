# En: Gameplay Settings
# Pt: Configuracoes de gameplay
gameplay:
  # En: Mod difficulty. Journey enables restricted utility items, while Normal keeps them disabled.
  # Pt: Dificuldade do mod. Journey libera itens utilitarios restritos, enquanto Normal os mantem desabilitados.
  # Allowed values:
  # - JOURNEY
  # - NORMAL
  modDifficulty: NORMAL

  # En: Self restraint mode disables restricted cheat-like GTNA items.
  # Pt: Self restraint desabilita itens restritos e com cara de cheat do GTNA.
  selfRestraint: false

# En: Client Settings
# Pt: Configuracoes do cliente
client:
  # En: Disable fly inertia when the player stops moving in the air.
  # Pt: Remove a inercia do voo quando o jogador para de se mover no ar.
  disableFlyInertia: true

  # En: Show the wireless steam network HUD (balance, flow and connected hatches).
  # Pt: Mostra o HUD da rede wireless de vapor (saldo, fluxo e hatches conectados).
  wirelessSteamHud: false

  # En: Wireless steam HUD horizontal position: 0 = left edge, 100 = right edge.
  # Pt: Posicao horizontal do HUD de vapor: 0 = esquerda, 100 = direita.
  wirelessSteamHudX: 5

  # En: Wireless steam HUD vertical position: 0 = top edge, 100 = bottom edge.
  # Pt: Posicao vertical do HUD de vapor: 0 = topo, 100 = baixo.
  wirelessSteamHudY: 75

  # En: Seconds of balance history drawn as a graph in the HUD (0 hides the graph).
  # Pt: Segundos de historico de saldo no grafico do HUD (0 esconde o grafico).
  wirelessSteamHudHistorySeconds: 60

# En: Machine Settings
# Pt: Configuracoes de maquinas
machines:
  # En: Energy Cost Multiplier for Accelerate Hatch.
  accelerateHatchEnergyCost: 1.5

  # En: Let a GTNA ME Pattern Buffer switch the machine mode of GTCEu multiblocks
  # En: (e.g. the Large Cutter between cutter and lathe). The buffer only drives the
  # En: mode while the machine is idle, so it never interrupts work; the buffer's own
  # En: per-slot mode pins and its buffer-level filter stay the manual control.
  # Pt: Permite que um ME Pattern Buffer do GTNA troque o modo de maquinas do GTCEu
  # Pt: (ex: Large Cutter entre cutter e lathe) enquanto a maquina estiver ociosa.
  bufferDrivenMachineMode: true

  # En: Enable RaishxCore crafting planner for Nexus ME Hypercore grids
  # Pt: Ativar planner RaishxCore nas redes do Nexus ME Hypercore
  nexusPlannerEnabled: true

  wirelessSteamTransferRate: 8192

  # En: Steam produced per sunlit solar boiling cell per 20-tick cycle in the
  # En: Large Steam Solar Boiler (mB). 20x the original 200 mB: a 41x42 field makes
  # En: ~6,240,000 mB per second instead of ~312,000, which matches the massive
  # En: structure cost.
  # Pt: Vapor por celula solar por ciclo de 20 ticks no Large Steam Solar Boiler (mB).
  # Pt: 20x o valor original de 200 mB: um campo 41x42 passa a fazer ~6.240.000 mB/s.
  solarBoilerSteamPerCell: 4000

  # En: Output Multiplier for Dense Steam.
  voidMinerDenseOutputMult: 2

  # En: Speed Multiplier for Dense Steam.
  voidMinerDenseSpeedMult: 2.0

  # En: Energy Cost Multiplier for Dense Steam.
  voidMinerDenseEnergyMult: 1.5

  # En: Output Multiplier for SuperHeated Steam.
  voidMinerSuperHeatedOutputMult: 3

  # En: Speed Multiplier for SuperHeated Steam.
  voidMinerSuperHeatedSpeedMult: 3.0

  # En: Energy Cost Multiplier for SuperHeated Steam.
  voidMinerSuperHeatedEnergyMult: 2.0

  # En: Output Multiplier for Insanely Steam.
  voidMinerInsanelyOutputMult: 5

  # En: Speed Multiplier for Insanely Steam.
  voidMinerInsanelySpeedMult: 5.0

  # En: Energy Cost Multiplier for Insanely Steam.
  voidMinerInsanelyEnergyMult: 4.0

  # Nexus Flux Matrix Configuration
  nexusFluxMatrix:
    # Base efficiency loss percentage at Tier 1 (LV).
    baseLossPercent: 15.0

    # Max transfer capacity per tick for a MAX Tier array.
    maxTransferTierMAX: 500000000000000000000000

    # If false, efficiency uses the average capacitor tier. If true, it uses the highest installed tier.
    useHighestTierForEfficiency: false

# En: Restricted item rules
# Pt: Regras de itens restritos
restrictedItems:
  # En: Hide restricted items from JEI and creative tabs when disabled.
  hideFromJei: true

  # En: Disable recipes that use the broad restricted-items condition.
  disableRecipes: false

  # En: Disable restricted item usage entirely unless explicitly allowed below.
  disableUsage: false

  # En: Allow infinity covers.
  allowInfinityCovers: true

  # En: Allow output boost parts.
  allowOutputBoostParts: true

  # En: Allow infinite input parts.
  allowInfiniteInputParts: true

  # En: Allow Quantum Cosmic Nexus armor.
  allowQuantumCosmicNexusArmor: true

  # En: Allow Reality Ripper.
  allowRealityRipper: true

# En: Wireless steam network rules
# Pt: Regras da rede wireless de vapor
wirelessSteam:
  # En: Master switch for the wireless steam network.
  enabled: true

  # En: Tank capacity for the bronze wireless steam INPUT hatch (network -> machine).
  # En: Deliberately small: a huge input buffer let a single hatch hoard the whole pool,
  # En: which starved every other machine and made the network read 0 mB (the reported
  # En: 'network always 0' bug). The input hatch only bridges the gap until its machine
  # En: consumes the steam. 100,000 mB = 100 buckets.
  bronzeInputBuffer: 100000

  # En: Tank capacity for the steel wireless steam INPUT hatch (network -> machine).
  # En: Integer.MAX_VALUE = effectively unbounded, like GTNL's steel wireless energy hatch.
  steelInputBuffer: 2147483647

  # En: Tank capacity for the bronze wireless steam OUTPUT hatch (boiler -> network).
  # En: GTNL parity: the bronze wireless dynamo holds 128,000,000 mB. The buffer is the
  # En: real per-tick throughput limit: a large boiler can only move what fits in the tank,
  # En: so it must hold a whole recipe cycle (a 41x42 solar boiler makes 6,240,000 mB per
  # En: 20-tick cycle at the current balance). A small buffer voids the rest of the cycle.
  bronzeOutputBuffer: 128000000

  # En: Tank capacity for the steel wireless steam OUTPUT hatch (boiler -> network).
  steelOutputBuffer: 2147483647

  # En: Optional per-tick transfer limit for bronze wireless steam hatches.
  # En: Integer.MAX_VALUE (the default) moves the whole buffer every tick, exactly like
  # En: GTNL's WirelessSteamDynamoHatch, so a boiler never strands its production. Lower
  # En: it only to deliberately throttle the wireless network.
  bronzeTransferRate: 2147483647

  # En: Optional per-tick transfer limit for steel wireless steam hatches (default: whole buffer).
  steelTransferRate: 2147483647

